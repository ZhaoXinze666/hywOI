<!-- ═══════════ 成员 ═══════════ -->
<main class="section collection-section">
  <header class="page-banner member-banner">
    <div class="page-banner-copy">
      <span class="page-eyebrow"><span class="kicker-dot"></span> PEOPLE · COMMUNITY</span>
      <h1>团队成员</h1>
      <p>认识一起讨论、练习和成长的伙伴。</p>
    </div>
    <div class="page-emblem member-emblem" aria-hidden="true"><span>✳</span><i></i><i></i><i></i></div>
  </header>
  <div class="collection-toolbar">
    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input id="member-search" type="search" aria-label="搜索成员或角色" placeholder="搜索成员或角色…" autocomplete="off">
    </label>
    <div class="collection-count"><strong id="member-count">0</strong><span>位伙伴</span></div>
  </div>
  <p class="collection-hint">选择一张成员卡片，查看详细介绍。</p>
  <div class="member-grid" id="member-grid" aria-live="polite"></div>
</main>

<!-- 成员详情弹窗 -->
<div class="modal-mask" id="modal-mask" aria-hidden="true" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-name" aria-describedby="m-desc">
    <button class="close" type="button" aria-label="关闭成员详情" onclick="closeModal()">&times;</button>
    <div class="avatar" id="m-avatar"></div>
    <h3 id="m-name"></h3>
    <div class="m-role" id="m-role"></div>
    <div class="m-desc" id="m-desc"></div>
    <a class="m-link" id="m-link" target="_blank" rel="noopener">查看洛谷主页 →</a>
    <div style="text-align:center;color:#c9ced6;font-size:12px;margin-top:18px;" id="m-uid"></div>
  </div>
</div>
